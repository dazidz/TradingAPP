name: Nino Autonomous Routine

on:
  schedule:
    - cron: "0 20 * * 1-5"
  workflow_dispatch:

jobs:
  run-nino:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Debug - List Files
        run: |
          ls -R

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install yfinance pandas numpy pytz requests supabase

      - name: Run Nino
        run: python -m employees.nino
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}