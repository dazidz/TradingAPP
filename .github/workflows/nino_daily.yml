import os
import sys
from supabase import create_client
from employees.nino import NinoSignalsAssistant

def main():
    # Umgebungsvariablen aus GitHub Secrets auslesen
    url = os.environ.get("SUPABASE_URL")
    key = os.environ.get("SUPABASE_KEY")

    if not url or not key:
        print("Fehler: SUPABASE_URL oder SUPABASE_KEY sind nicht gesetzt!")
        sys.exit(1)

    print("Verbinde mit Supabase...")
    supabase = create_client(url, key)

    print("Nino startet seine automatisierte Schicht...")
    nino = NinoSignalsAssistant(supabase)
    logs = nino.daily_routine()

    for log in logs:
        print(f"[Nino Log]: {log}")
        
    print("Nino hat seine Schicht beendet.")

if __name__ == "__main__":
    main()