name: Fritz Daily Data Worker

on:
  schedule:
    - cron: '0 2 * * *'  # Läuft jeden Tag um 02:00 Uhr UTC
  workflow_dispatch:      # Ermöglicht auch den manuellen Start über das GitHub-Webinterface

jobs:
  run-fritz:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas supabase

      - name: Fritz-Skript ausführen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python employees_test/fritz.py